 <!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="screen-orientation" content="portrait">
<meta name="orientation" content="portrait">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Traffic Counter</title>
<style>
  
:root{
  --bg: #1c1c1c;
  --text: #ffffff;
  --accent: #601ad1;
  --accent-2: #601ad1;;
  --muted: #bdbdbd;
  --card-accent: #ec5e27; /* warna kotak kecil */
  --shadow: 0 6px 18px rgba(0,0,0,0.6);
  --radius: 14px;
  --gap: 16px;
  --control-height: 48px;
  --accent-contrast: #ffffff;
 --card-bg: #ffffff; /* kotak jadi putih */ 
 --card-contrast: #111111; /* teks di atas kotak jadi gelap */ 
}


.card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  border-radius:14px;
  border:none;
  color:white;
  min-height:64px;
}

.card .icon{ font-size:26px }
.card .info{ flex:1; margin-left:10px; text-align:left }
.card .name{ font-size:14px; font-weight:500 }
.card .desc{ font-size:11px; opacity:.85 }
.card .stat{ text-align:right }
.card .count{ font-size:16px; font-weight:800 }
.card .percent{ font-size:11px }

.sm{ background:#2f80ed }
.mp{ background:#27ae60 }
.ks{ background:#9b51e0 }
.bb{ background:#f2994a }
.tb{ background:#eb5757 }
.ktb{ background:#56ccf2 }
.pk{ background:#95a5a6 } /* abu netral, tidak dominan */


.card.disabled{ opacity:.4; pointer-events:none }
.card:active{
  transform:none;
}
.card{
  touch-action: manipulation;
}
/* ===== TILE GRID MODE ===== */
.mobile-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:12px;
  padding:12px;
}

.tile{
  aspect-ratio: 1 / 1;
  border-radius:16px;
  border:none;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:700;
  touch-action: manipulation;
}

.tile:active{
  transform:scale(0.97);
}

.tile.disabled{
  opacity:.4;
  pointer-events:none;
}

.tile-icon{
  font-size:32px;
}

.tile-count{
  font-size:26px;
  font-weight:800;
}

.tile-label{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
}

.tile-label .code{
  font-weight:700;
}

.tile-label .fullname{
  font-size:11px;
  opacity:.85;
  white-space:nowrap;
}

.app {
  height: 100vh;
  overflow-y: auto;   /* INI KUNCINYA */
  -webkit-overflow-scrolling: touch;
}





*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ===== MOBILE FAST TAP FIX ===== */
button{
  -webkit-tap-highlight-color: transparent;
}

/* Header */
header{
  background:linear-gradient(180deg, rgba(125,57,235,0.06), rgba(198,255,51,0.02));
  padding:6px 10px;
  text-align:center;
  box-shadow:var(--shadow);
}
header strong{display:block;font-size:15px}
header #timer{font-weight:600;color:var(--muted);margin-top:6px;display:block}

/* Controls */
.controls{
  display:grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  gap:6px;
  padding:6px 8px;
  margin:4px auto;
  align-items:center;
}
.hide-on-run{
  display:block;
}

.controls.running .hide-on-run{
  display:none;
}

.controls input,
.controls select,
.controls button{
  height:34px;   /* KUNCI UKURAN MENU */

  padding:0 14px;
  font-size:15px;
  border-radius:10px;
  border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--accent-contrast);
  box-shadow:0 8px 24px rgba(125,57,235,0.25);
}
.controls input::placeholder{
  color:rgba(255,255,255,0.75);
}


.controls button.export-blue{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:var(--accent-contrast); border:none }
.controls button#btnStart.active{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:var(--accent-contrast); border:none; box-shadow:0 8px 24px rgba(125,57,235,0.18) }

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--gap);
  padding:16px;
  max-width:1100px;
  margin:0 auto 48px;
}

/* Button cards */
.btn{
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border:1px solid rgba(255,255,255,0.03);
  border-radius:16px;
  padding:18px 12px;
  box-shadow:var(--shadow);
  text-align:center;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  min-height:150px;
}
.btn:active{ transform:translateY(2px) scale(.995) }
.btn:hover{ transform:translateY(-4px) }
.btn.disabled{ opacity:0.45; pointer-events:none; transform:none; box-shadow:none }

/* Minimal addition: kelas .colored untuk membuat kotak kontras (#ec5e27) */
.btn.colored {
  background: var(--card-bg);
  color: var(--card-contrast);
  border: 1px solid rgba(0,0,0,0.12);
  box-shadow: 0 10px 30px rgba(236,94,39,0.12);
}
.btn.colored .label,
.btn.colored .count {
  color: var(--card-contrast);
}

/* Circle icons (emoji) */
.circle{
  width:22vw;
  height:22vw;
  max-width:110px;
  max-height:110px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px; /* emoji size */
  color:var(--text);
  box-shadow:0 6px 18px rgba(0,0,0,0.6);
  background:linear-gradient(135deg,#2a2a2a,#1f1f1f);
  overflow:hidden;
}

/* vehicle color accents */
.circle.car{ background: linear-gradient(135deg,#7D39EB,#5A2BD6) }
.circle.bus{ background: linear-gradient(135deg,#C6FF33,#AEEA00); color:#111 }
.circle.bike{ background: linear-gradient(135deg,#7D39EB,#26a69a) }
.circle.van{ background: linear-gradient(135deg,#ef5350,#e53935) }
.circle.truck1{ background: linear-gradient(135deg,#e57373,#ef5350) }
.circle.truck2{ background: linear-gradient(135deg,#b71c1c,#c62828) }

/* ensure emoji centered and not selectable */
.circle .emoji { user-select:none; line-height:1; }

/* counts and labels */
.count{ font-size:20px; font-weight:700; color:var(--text) }
.label{ font-size:13px; color:var(--muted) }

/* Responsive */
@media (max-width:900px){
  .grid{ grid-template-columns:repeat(2,1fr) }
}
@media (max-width:520px){
  .grid{ grid-template-columns:1fr }
  .controls{ padding:10px }
  .controls input{ min-width:120px }
}
  @media (max-width:600px){
  .mobile-grid{
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width:420px){
  .mobile-grid{
    grid-template-columns: repeat(2, 1fr);
  }
}

  
/* ===== CUSTOM DROPDOWN THEME ===== */
.custom-select{
  position:relative;
  min-width:160px;
  user-select:none;
}

.custom-select .selected{
  height:var(--control-height);
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--accent-contrast);
  cursor:pointer;
  box-shadow:0 8px 24px rgba(125,57,235,0.25);
}

.custom-select .selected::after{
  content:"▼";
  font-size:12px;
}

.custom-select .options{
  position:absolute;
  top:110%;
  left:0;
  right:0;
  background:#1f1f1f;
  border-radius:10px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:none;
  z-index:999;
}

.custom-select.open .options{
  display:block;
}

.custom-select .options div{
  padding:12px 14px;
  cursor:pointer;
  color:#ffffff;
}

.custom-select .options div:hover{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:var(--accent-contrast);
}

@media (max-width: 600px) {

  .grid {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 12px;
  }

  .btn {
    min-height: 220px;
    padding: 24px 12px;
    border-radius: 20px;
  }

  .circle {
    width: 140px;
    height: 140px;
    font-size: 64px;
  }

  .count {
    font-size: 28px;
    margin-top: 8px;
  }

  .label {
    font-size: 16px;
    font-weight: 600;
  }

  /* tombol kontrol */
  .controls button,
  .controls input,
  .custom-select .selected {
  height: 34px;        /* KUNCI: bikin menu tidak makan layar */
  font-size: 13px;
  border-radius: 8px;
}

.controls{
  display:grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  gap:6px;
  padding:6px 8px;
  margin:4px auto;
  align-items:center;
}
.app-credit{
  position:fixed;
  bottom:6px;
  right:10px;
  font-size:11px;
  color:rgba(255,255,255,0.45);
  pointer-events:none;
  user-select:none;
}
header .subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.tile,
.tile * {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -ms-user-select: none;
}

.tile {
  touch-action: manipulation;
}



</style>
</head>

<script>
const ACCESS_PIN = "111";

  checkLogin();
});

function checkLogin(){
  if (localStorage.getItem(LOGIN_KEY) === ACCESS_PIN) {
    showApp();
    return;
  }
  askPin();
}

function askPin(){
  let tries = Number(localStorage.getItem(TRY_KEY)) || 0;

  const input = prompt("Masukkan PIN Akses");
  if (input === null) return; // user cancel

  const pin = input.trim();

  if (pin === ACCESS_PIN) {
    localStorage.setItem(LOGIN_KEY, ACCESS_PIN);
    localStorage.removeItem(TRY_KEY);
    showApp();
    return;
  }

<script>
let counters = { SM:0, MP:0, KS:0, BB:0, TB:0, KTB:0, PK:0 };
let logs = [];
let startTime = null;
let timerInt = null;
let intervalCount = 1;
let surveyorName = "";
let selectedLane = "Kiri";
let paused = false;
let pausedAt = 0;
let surveyRunning = false;
let eventId = Number(localStorage.getItem("eventId")) || 1;
let holdTimer = null;
let holdTriggered = false;
let activeType = null;
const HOLD_TIME = 600; // ms
document.addEventListener("contextmenu", function(e){
  if(e.target.closest(".tile")){
    e.preventDefault();
  }
});

function startHold(type, e){
  if(e) e.preventDefault();
  if(!startTime || paused) return;

  activeType = type;
  holdTriggered = false;

  holdTimer = setTimeout(() => {
    holdTriggered = true;
    undoLast(type);   // ➖ MINUS
    vibrateTap();
  }, HOLD_TIME);
}


function endHold(){
  if(holdTimer){
    clearTimeout(holdTimer);
    holdTimer = null;
  }

  if(!holdTriggered && activeType){
    count(activeType); // ➕ PLUS
  }

  activeType = null;
}

function saveState(){
  const state = {
    counters,
    logs,
    startTime,
    intervalCount,
    selectedLane,
    surveyorName,
    paused,
    pausedAt,
    surveyRunning
  };
  localStorage.setItem("trafficState", JSON.stringify(state));
  localStorage.setItem("eventId", eventId); // ✅ TAMBAHKAN INI
}



function loadState(){
  const raw = localStorage.getItem("trafficState");
  if(!raw) return false;

  const state = JSON.parse(raw);

  counters = state.counters || counters;
  logs = state.logs || [];
  startTime = state.startTime;
  intervalCount = state.intervalCount || 1;
  selectedLane = state.selectedLane || "Kiri";
  surveyorName = state.surveyorName || "";
  paused = state.paused || false;
  pausedAt = state.pausedAt || 0;
  surveyRunning = state.surveyRunning || false; // ✅ TAMBAHKAN

  return true;
}


/* JavaScript tetap sama seperti sebelumnya */
const INTERVAL_MINUTE = 15;
const INTERVAL_SEC = INTERVAL_MINUTE * 60;
const API_URL = "https://script.g";



  document.addEventListener("keydown", function(e){
  if(!surveyRunning) return;

  // F5 atau Ctrl + R
  if(e.key === "F5" || (e.ctrlKey && e.key === "r")){
    e.preventDefault();
    showRefreshWarning();
  }
});


window.addEventListener("load", () => {
  const restored = loadState();

  if(restored){
    for(let k in counters){
      document.getElementById(k).innerText = counters[k];
    }

    document.getElementById("surveyor").value = surveyorName || "";
    document.querySelector("#laneSelect .selected").innerText = "Lajur " + selectedLane;

    if(surveyRunning && startTime && !paused){
      toggleButtons(true);
      timerInt = setInterval(updateTimer, 1000);
    } else {
      toggleButtons(false);
    }
  } else {
    toggleButtons(false);
  }

  // ✅ SEMUA INI HARUS DI DALAM window.load
  document.querySelectorAll('input[name="lane"]').forEach(r=>{
    r.disabled = false;
  });

  const btn = document.getElementById("btnExport");
if (btn) {
  btn.disabled = false;
}

  document.getElementById("timer").innerText = "00:00:00";
});






function showRefreshWarning(){
  document.getElementById("refreshWarn").style.display = "flex";
}

function hideRefreshWarning(){
  document.getElementById("refreshWarn").style.display = "none";
}


function toggleDropdown(){
  document.getElementById("directionSelect").classList.toggle("open");
}

function setDirection(value,label){
  selectedDirection = value;
  document.querySelector("#directionSelect .selected").innerText = label;
  document.getElementById("directionSelect").classList.remove("open");
}

function formatDateTimeForLog(d){
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');

  // Dipaksa sebagai TEXT oleh Excel
  return `="${dd}/${mm}/${yyyy} ${hh}:${min}:${ss}"`;
}

function vibrateTap(){
  if (navigator.vibrate) navigator.vibrate(20);
}

function vibrateStart(){
  if (navigator.vibrate) navigator.vibrate(60);
}

function vibrateStop(){
  if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
}

  
function pause(){
  if (!startTime || paused) return;

  paused = true;
  surveyRunning = false;

  document.querySelector(".controls").classList.remove("running");

  pausedAt = Date.now();

  if (timerInt) {
    clearInterval(timerInt);
    timerInt = null;
  }

  toggleButtons(false);
  saveState();

  
}


  // buka pilihan lajur saat pause
 


function toggleLane(){
  document.getElementById("laneSelect").classList.toggle("open");
}

function setLane(lane){
  selectedLane = lane;
  document.querySelector("#laneSelect .selected").innerText = "Lajur " + lane;
  document.getElementById("laneSelect").classList.remove("open");
}



function start(){
 if(!navigator.onLine){
  alert("Tidak ada koneksi internet.\nSurvey tidak boleh dimulai karena data tidak akan tersimpan.");
  return;
}

  const inputName = document.getElementById("surveyor").value.trim();
  if (!inputName) {
    alert("Nama surveyor wajib diisi sebelum memulai.");
    return;
  }

  surveyorName = inputName;
document.querySelector(".controls").classList.add("running");
  /* ===== RESUME DARI PAUSE ===== */
  if (startTime && paused) {
    startTime += (Date.now() - pausedAt);
    paused = false;
    surveyRunning = true;

    // kunci lajur lagi
   

    toggleButtons(true);

    if (timerInt) clearInterval(timerInt);
    timerInt = setInterval(updateTimer, 1000);
    return;
  }

  /* ===== JIKA SUDAH JALAN, JANGAN DUPLIKASI ===== */
  if (startTime) return;

  /* ===== START BARU ===== */
  surveyRunning = true;
  startTime = Date.now();


  toggleButtons(true);

  if (timerInt) clearInterval(timerInt);
  timerInt = setInterval(updateTimer, 1000);

  saveState();

  vibrateStart();
}


function stop(){
  if(timerInt) clearInterval(timerInt);

  timerInt = null;
  startTime = null;
  paused = false;
  surveyRunning = false;

  document.querySelector(".controls").classList.remove("running");

  resetCounters();
  logs = [];

  document.getElementById("timer").innerText = "00:00:00";

  toggleButtons(false);

  // ✅ HAPUS STATE DI SINI SAJA
  localStorage.removeItem("trafficState");
  eventId = 1;
  localStorage.removeItem("eventId");


  vibrateStop();
}




function toggleButtons(enable){

/* ================= TIMER ================= */
function updateTimer(){
  if(!startTime) return;

  let t = Math.floor((Date.now() - startTime) / 1000);
  let h = String(Math.floor(t / 3600)).padStart(2,'0');
  let m = String(Math.floor((t % 3600) / 60)).padStart(2,'0');
  let s = String(t % 60).padStart(2,'0');

  document.getElementById("timer").innerText = `${h}:${m}:${s}`;

  if(t >= INTERVAL_SEC){
    const btn = document.getElementById("btnExport");
    if (btn){
      btn.disabled = false;
      btn.classList.remove("export-red");
      btn.classList.add("export-blue");
    }
  } else {
    const btn = document.getElementById("btnExport");
    if (btn){
      btn.disabled = true;
      btn.classList.remove("export-blue");
      btn.classList.add("export-red");
    }
  }
}



/* ================= COUNT ================= */
function sendToSheet(log){
  const data = new URLSearchParams();
  data.append("id", log.id);
  data.append("time", log.time);
  data.append("lane", log.lane);
  data.append("vehicle", log.vehicle);
  data.append("surveyor", log.name);
  data.append("status", log.status); // ✅ BENAR

  fetch(API_URL, {
  method: "POST",
  mode: "no-cors",
  body: data
});

}




  
function count(type){
  if(!navigator.onLine){
    alert("Tidak ada koneksi internet.\nSilakan hubungkan internet terlebih dahulu.\n\nData TIDAK akan masuk ke Excel.");
    return;
  }

  if(!startTime || paused) return;

  counters[type]++;
  document.getElementById(type).innerText = counters[type];

  const log = {
    id: eventId++,
    time: formatDateTimeForLog(new Date()),
    lane: selectedLane,
    vehicle: type,
    name: surveyorName,
    status: "ADD"
  };

  logs.push(log);
  sendToSheet(log);
  saveState();
}



function undoLast(type){
 if(!navigator.onLine){
  alert("Tidak ada koneksi internet.\nUndo diblokir karena data Excel tidak bisa diupdate.");
  return;
}

  for(let i = logs.length - 1; i >= 0; i--){
    const log = logs[i];

    if(log.vehicle === type && log.status === "ADD"){

      // 1. update counter lokal
      counters[type] = Math.max(0, counters[type] - 1);
      document.getElementById(type).innerText = counters[type];

      // 2. kirim CANCEL DENGAN ID YANG SAMA
      sendToSheet({
        ...log,
        status: "CANCEL"
      });

      // 3. hapus ADD dari log lokal
      logs.splice(i, 1);

      saveState();
      return;
    }
  }
}




function sendCancelToSheet(log){
  const data = new URLSearchParams();
  data.append("action", "CANCEL");
  data.append("id", log.id);

  fetch(API_URL, {

  mode: "no-cors",

});

}

function sanitizeFilename(name){
    if(!name) return "";
    return String(name).trim().replace(/[\/\\]/g, '-').replace(/[<>:"|?*\x00-\x1F]/g, '').replace(/\s+/g, '_');
}
function pad(n){ return String(n).padStart(2,'0'); }
function formatDateForFilename(d){
    const dd = pad(d.getDate());
    const mm = pad(d.getMonth()+1);
    const yy = String(d.getFullYear()).slice(-2);
    return `${dd}-${mm}-${yy}`;
}
/* ================= EXPORT ================= */
function exportCSV(){

    // ===== PENGAMAN 15 MENIT =====
    if(!startTime) return;

    const elapsed = (Date.now() - startTime) / 1000;
    if(elapsed < INTERVAL_SEC){
        alert("Export hanya bisa dilakukan setelah 15 menit.");
        return;
    }
    // ============================

    const nameNow = document.getElementById("surveyor").value.trim();
    const displayName = nameNow || surveyorName || "";

    // ===== HEADER CSV =====
    let csv = `Nama Surveyor: ${displayName}\n`;
    csv += `Tanggal: ${formatDateTimeForLog(new Date())}\n\n`;
    csv += `Waktu;Lajur;Kendaraan;Nama Surveyor\n`;


    // ===== ISI DATA RAW =====
    logs.forEach(l=>{
        const safeName = l.name
            ? `"${String(l.name).replace(/"/g,'""')}"`
            : "";
        csv += `${l.time};${l.lane};${l.vehicle};${safeName}\n`;

    });

    // ===== DOWNLOAD =====
    const blob = new Blob(["\uFEFF" + csv], {
  type: "text/csv;charset=utf-8;"
});

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);

    const now = new Date();
    const datePart = formatDateForFilename(now);
    const safeFileName = sanitizeFilename(displayName);
    a.download = safeFileName
        ? `${safeFileName}_traffic_${datePart}.csv`
        : `traffic_${datePart}.csv`;

    a.click();

    // ===== RESET UNTUK INTERVAL BERIKUTNYA =====
    startTime = Date.now();
    resetCounters();
}

function resetCounters(){
  for(let k in counters){
    counters[k] = 0;
    document.getElementById(k).innerText = 0;

    const pct = document.getElementById(k+"_pct");
    if(pct) pct.innerText = "0%";
  }
  logs = [];
}

function updatePercent(){
  const total = Object.values(counters).reduce((a,b)=>a+b,0);
  if(!total) return;

  for(let k in counters){
    const pct = ((counters[k]/total)*100).toFixed(1);
    const el = document.getElementById(k+"_pct");
    if(el) el.innerText = pct+"%";
  }
}
